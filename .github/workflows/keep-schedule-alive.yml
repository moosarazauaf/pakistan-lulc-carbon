name: Keep the schedule alive

# GitHub automatically disables scheduled workflows in a public repository after
# 60 days with no repository activity. This repo is public and is a finished
# piece of research, so it can easily sit untouched for two months. When that
# happens the keep-awake schedule is disabled without warning, the app starts
# hibernating again, and nothing says why.
#
# A disabled workflow cannot re-enable itself, and the auto-disable applies to
# every scheduled workflow in the repo at once, so no other workflow can rescue
# it either. Real repository activity is the only thing that resets the clock.
#
# One empty commit a month does that. It is 12 commits a year of noise, which is
# the price of the app staying up through a quiet stretch.

on:
  schedule:
    - cron: "17 4 1 * *"  # 04:17 UTC on the 1st, off the hour to dodge cron peak
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: keep-schedule-alive

jobs:
  bump:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Push an empty commit to reset the 60-day timer
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --allow-empty -m "chore: keep scheduled workflows enabled

          GitHub disables scheduled workflows in public repos after 60 days
          without repository activity. This empty monthly commit resets that
          timer so the keep-awake schedule keeps running."
          git push
